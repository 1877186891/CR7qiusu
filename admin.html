<body>

<button onclick="login()">登录</button>

<input id="video" type="file" accept="video/*">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const CLOUD_NAME="kkkyei3p";
const UPLOAD_PRESET="CR7qiusu";

const SUPABASE_URL="https://beniovhhwttbemmigoyz.supabase.co";

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlbmlvdmhod3R0YmVtbWlnb3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjIyNDUsImV4cCI6MjEwMTczODI0NX0.dw7Na2xWyFcVpPf_R4efj0phsQU2oEFGNyn9cj3Bz7M";




function login(){

let p=document.getElementById("password").value;

if(p=="CR7admin"){

document.getElementById("panel").style.display="block";

alert("登录成功");

}else{

alert("密码错误");

function uploadVideo(){

let file=document.getElementById("video").files[0];

if(!file){

alert("请选择视频");

return;

}


let data=new FormData();

data.append("file",file);

data.append("upload_preset",UPLOAD_PRESET);



fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
{
method:"POST",
body:data
}
)

.then(res=>res.json())

.then(async result=>{

let videoUrl = result.secure_url;

const { data, error } = await supabase
.from("videos")
.insert([
{
title: "CR7视频",
url: videoUrl
}
]);

if(error){

console.log(error);
alert("保存数据库失败");

}else{

document.getElementById("result").innerHTML=
"上传成功:<br>"+videoUrl;

}

})

.catch(()=>{

alert("上传失败");

});


}

</script>
